# ===============================
# DATABASE
# ===============================
# Use env if provided (Render), fallback to local dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/summaries_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================
# Render sets PORT; locally default to 8080
server.port=${PORT:8080}

# ===============================
# JWT CONFIG
# ===============================
app.jwt.secret=${JWT_SECRET:dev-insecure-secret}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ===============================
# ACTUATOR / MANAGEMENT
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ===============================
# CORS (comma-separated origins). Example for production frontend:
# app.cors.allowed-origins=https://your-frontend.onrender.com,https://www.yourdomain.com
# Defaults below cover local dev.
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
