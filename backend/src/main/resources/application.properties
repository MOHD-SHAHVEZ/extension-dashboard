# Values come from environment (Render / local). Do not put real secrets here.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===============================
# DATABASE (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_summaries}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=NexusHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===============================
# JWT / OTP
# ===============================
app.jwt.secret=${JWT_SECRET:change-me-in-env}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
app.otp.salt=${OTP_SALT:change-me-in-env}

# ===============================
# MAIL (optional — if unset, OTP is logged to console only)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.test-connection=false

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Render health hits /actuator/health. Gmail SMTP often times out from Render
# and would mark the whole app DOWN even though the API is fine.
management.health.mail.enabled=false

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://extension-dashboard-ovj.vercel.app,https://*.vercel.app,*}

# ===============================
# SECURITY / FEATURE FLAGS
# ===============================
app.security.allow-default-users=${ALLOW_DEFAULT_USERS:false}

# ===============================
# GROQ
# ===============================
app.ai.api-key=${GROQ_API_KEY:}
app.ai.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.ai.base-url=${GROQ_CHAT_URL:https://api.groq.com/openai/v1}

spring.ai.model.chat=openai
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.temperature=${SPRING_AI_TEMPERATURE:0.3}
spring.ai.openai.chat.options.max-tokens=${SPRING_AI_MAX_TOKENS:4096}

spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.avatar.max-bytes=${AVATAR_MAX_BYTES:5242880}
app.avatar.max-changes-per-month=${AVATAR_MAX_CHANGES_PER_MONTH:3}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
