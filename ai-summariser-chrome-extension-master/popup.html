<!DOCTYPE html>
<html>
  <head>
    <title>AI Summary</title>
    <style>
      :root {
        --bg-1: #f5f7ff;
        --bg-2: #eef6ff;
        --primary: #4285f4;
        --primary-600: #3367d6;
        --success: #34a853;
        --success-600: #2e8b57;
        --text: #1f2937;
        --card-bg: #ffffffcc;
        --border: #e5e7eb;
        --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      body {
        font-family: Arial, sans-serif;
        min-width: 500px;
        min-height: 300px;
        padding: 15px;
        color: var(--text);
        background: linear-gradient(120deg, var(--bg-1), var(--bg-2));
        background-size: 200% 200%;
        animation: gradientShift 12s ease infinite;
      }

      h2 {
        color: var(--text);
        margin-bottom: 15px;
        letter-spacing: 0.2px;
        position: relative;
        display: inline-block;
      }
      h2:after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, var(--primary), var(--success));
        border-radius: 3px;
        box-shadow: 0 4px 12px rgba(66, 133, 244, 0.35);
      }

      .options {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
      }

      /* Prevent input overflow and keep layout stable */
      input, select, button {
        max-width: 100%;
        box-sizing: border-box;
      }
      .text-input {
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        background: #fff;
      }

      button {
        padding: 8px 15px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.12s ease, box-shadow 0.2s ease,
          background-color 0.2s ease;
        box-shadow: 0 6px 14px rgba(66, 133, 244, 0.25);
      }

      button:hover {
        background-color: var(--primary-600);
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(66, 133, 244, 0.28);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 4px 10px rgba(66, 133, 244, 0.2);
      }

      #copy-btn {
        background-color: var(--success);
        box-shadow: 0 6px 14px rgba(52, 168, 83, 0.25);
      }

      #copy-btn:hover {
        background-color: var(--success-600);
        box-shadow: 0 10px 20px rgba(52, 168, 83, 0.28);
      }

      #summary-type {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        transition: box-shadow 0.2s ease, transform 0.12s ease;
      }

      #summary-type:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      }

      #result {
        margin-top: 15px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        min-height: 150px;
        max-height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
        line-height: 1.6;
        background: var(--card-bg);
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      #result.show {
        opacity: 1;
        transform: translateY(0);
      }

      #result ul {
        padding-left: 20px;
      }

      #result li {
        margin-bottom: 10px;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 150px;
      }

      /* AI themed loader */
      .ai-loader {
        position: relative;
        width: 220px;
        height: 140px;
        display: grid;
        place-items: center;
      }

      .ai-core {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, var(--primary));
        box-shadow: 0 0 20px rgba(66, 133, 244, 0.6), 0 0 40px rgba(66, 133, 244, 0.35);
        animation: pulseGlow 2s ease-in-out infinite;
      }

      .ring {
        position: absolute;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 2px dashed rgba(66, 133, 244, 0.45);
        box-shadow: inset 0 0 20px rgba(66, 133, 244, 0.15);
        filter: drop-shadow(0 0 12px rgba(66, 133, 244, 0.25));
      }
      .ring.r1 { animation: rotateRing 6s linear infinite; }
      .ring.r2 {
        width: 120px;
        height: 120px;
        border-color: rgba(52, 168, 83, 0.45);
        animation: rotateRing 9s linear infinite reverse;
      }

      .particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .particles span {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, var(--primary));
        opacity: 0.85;
        animation: floatParticle 3.2s ease-in-out infinite;
      }
      .particles span:nth-child(1) { top: 8%; left: 12%; animation-delay: 0s; }
      .particles span:nth-child(2) { top: 18%; right: 10%; animation-delay: .2s; }
      .particles span:nth-child(3) { bottom: 16%; left: 14%; animation-delay: .4s; }
      .particles span:nth-child(4) { bottom: 10%; right: 12%; animation-delay: .6s; }
      .particles span:nth-child(5) { top: 50%; left: 4%; animation-delay: .8s; }
      .particles span:nth-child(6) { top: 56%; right: 4%; animation-delay: 1s; }
      .particles span:nth-child(7) { top: 8%; left: 50%; animation-delay: 1.2s; }
      .particles span:nth-child(8) { bottom: 8%; left: 50%; animation-delay: 1.4s; }

      .ai-caption {
        position: absolute;
        bottom: -4px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: #374151;
        background: linear-gradient(90deg, var(--primary), var(--success));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: .4px;
        animation: shimmerText 2.2s ease-in-out infinite;
      }

      @keyframes rotateRing { to { transform: rotate(360deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pulseGlow { 0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(66,133,244,.6), 0 0 40px rgba(66,133,244,.35);} 50% { transform: scale(1.06); box-shadow: 0 0 28px rgba(66,133,244,.75), 0 0 60px rgba(66,133,244,.45);} }
      @keyframes floatParticle { 0%, 100% { transform: translate(0,0); opacity: .85; } 50% { transform: translate(0, -10px); opacity: 1; } }
      @keyframes shimmerText { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <h2 style="margin:0;">AI Summary</h2>
      <div id="account-area">
        <button id="account-btn" title="Account">Account</button>
      </div>
    </div>

    <div class="options">
      <select id="summary-type">
        <option value="brief">Brief Summary</option>
        <option value="detailed">Detailed Summary</option>
        <option value="bullets">Bullet Points</option>
      </select>
      <button id="summarize">Summarize This Page</button>
      <button id="copy-btn">Copy Summary</button>
    </div>

    <div id="result">
      Select a summary type and click 'Summarize This Page' to generate a
      summary.
    </div>

    <div id="auth-panel" style="display:none;margin-top:12px;">
      <div class="options" style="flex-direction:column;gap:8px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="show-login">Login</button>
          <button id="show-signup">Sign Up</button>
          <button id="logout-btn" style="display:none;background:#ef4444;">Logout</button>
        </div>
        <div id="auth-forms">
          <div id="login-form" style="display:none;">
            <input id="login-email" class="text-input" type="email" placeholder="Email" style="margin-bottom:6px;" />
            <input id="login-password" class="text-input" type="password" placeholder="Password" style="margin-bottom:6px;" />
            <button id="login-submit">Login</button>
          </div>
          <div id="signup-form" style="display:none;">
            <div style="display:flex; gap:8px; width:100%;">
              <input id="signup-first-name" class="text-input" type="text" placeholder="First name" />
              <input id="signup-last-name" class="text-input" type="text" placeholder="Last name" />
            </div>
            <input id="signup-email" class="text-input" type="email" placeholder="Email" style="margin-top:6px;margin-bottom:6px;" />
            <input id="signup-password" class="text-input" type="password" placeholder="Password" style="margin-bottom:6px;" />
            <button id="signup-submit">Sign Up</button>
          </div>
        </div>
        <div id="auth-status" style="font-size:12px;color:#374151;"></div>
      </div>
    </div>

    <div id="dashboard" style="display:none;margin-top:12px;">
      <div class="options" style="flex-direction:column;gap:8px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="toggle-dashboard">My Dashboard</button>
          <button id="save-summary-btn" title="Save current summary">Save Summary</button>
        </div>
        <div>
          <input id="search-input" placeholder="Search..." style="padding:8px;border:1px solid var(--border);border-radius:8px;width:100%;" />
        </div>
        <div id="summary-list" style="max-height:220px;overflow:auto;display:grid;gap:8px;"></div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="api_config.js"></script>
    <script src="token_storage.js"></script>
    <script src="http_client.js"></script>
    <script src="auth_api.js"></script>
    <script src="summaries_api.js"></script>
    <script src="auth_ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
